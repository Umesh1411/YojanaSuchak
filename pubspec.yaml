name: yojana_suchak
description: YojanaSuchak - Voice-powered AI assistant for finding the best Maharashtra government schemes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  http: ^1.1.0
  google_generative_ai: ^0.4.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  shared_preferences: ^2.2.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  smooth_page_indicator: ^1.2.0+3
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  flutter_rating_bar: ^4.0.1
  mailer: ^6.0.1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/maharashtra_schemes.json
    - assets/data/scheme.csv
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/images/logo.png"

